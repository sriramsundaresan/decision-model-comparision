[project]
name = "intent-evaluation-demo"
version = "0.1.0"
description = "Excel intent-evaluation comparison for Microsoft-Decision-1 and Jev."
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.19,<2",
    "defusedxml>=0.7.1,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "openpyxl>=3.1.5,<4",
    "pydantic>=2,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
